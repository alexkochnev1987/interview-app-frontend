name: Frontend CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Regenerate OpenAPI types from committed spec
        run: npm run openapi:generate

      - name: Ensure generated types match committed spec
        run: git diff --exit-code -- src/lib/api-types.ts

      - run: npm run lint:ci
      - run: npm run test

      - name: Restore / Save Next.js build cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Production build for E2E
        run: npx next build
        env:
          BACKEND_URL: http://127.0.0.1:3000

      - name: Upload production build for E2E
        uses: actions/upload-artifact@v6
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 1

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      BACKEND_URL: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:3001
      E2E_PREBUILT: '1'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Download production build
        uses: actions/download-artifact@v7
        with:
          name: next-build
          path: .next

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm run test:e2e:install

      - name: Run E2E smoke tests
        run: npm run test:e2e

      - name: Upload E2E failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

# Deploy is handled by AWS Amplify auto-build (connected to GitHub repo).
# Amplify watches develop → dev, main → prod and builds automatically.